model:
  sft_config_path: "configs/explamma_15/config_sft_explamma_15.yaml"
  init_checkpoint_dir: "outputs/hybrid_sft_explamma_15/final"
  reference_checkpoint_dir: null

data:
  preference_jsonl: "outputs/preference_explamma_15_dpo_train/preferences.jsonl"
  val_preference_jsonl: "outputs/preference_explamma_15_val_from_sft/preferences.jsonl"
  val_ratio: 0.0
  seed: 42
  use_full_validation_set: true
  eval_num_examples: 50
  eval_sample_randomly: false
  eval_sample_seed: 42

loss:
  beta: 0.1
  average_log_prob: false

trainer:
  output_dir: "outputs/dpo_explamma_15"
  overwrite_output_dir: false
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  num_train_epochs: 2.5
  learning_rate: 5e-6
  weight_decay: 0.0
  warmup_ratio: 0.03
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 6
  keep_only_best_checkpoint: false
  load_best_model_at_end: true
  metric_for_best_model: "eval_preference_accuracy"
  greater_is_better: true
  secondary_metric_for_best_model: "eval_reward_margin"
  secondary_greater_is_better: true
  best_model_tie_epsilon: 1.0e-6
  early_stopping_patience: 10
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  report_to: "wandb"
  seed: 42

eval:
  enabled: false
  test_jsonl: "data/explamma_15/test.jsonl"
  output_jsonl: "outputs/dpo_explamma_15/dpo_eval.jsonl"
