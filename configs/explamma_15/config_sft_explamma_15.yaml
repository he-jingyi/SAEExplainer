model:
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  trust_remote_code: true
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  use_cache: false
  gradient_checkpointing: false

injection:
  placeholder_text: " ?"
  inject_layer: 1
  steering_coefficient: 1.0
  use_projector: false
  vector_input_dim: null

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: "all-linear"
  bias: "none"

data:
  train_jsonl: "data/explamma_15/sft.jsonl"
  val_jsonl: "data/explamma_15/val.jsonl"
  max_length: 1024
  val_ratio: 0.01
  seed: 42
  vector_store_cache_dir: "data/cache/hf_saes"
  require_decoder_vector_path: false

trainer:
  output_dir: "outputs/hybrid_sft_explamma_15"
  overwrite_output_dir: false
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  num_train_epochs: 2.5
  learning_rate: 5e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 5
  keep_only_best_checkpoint: false
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  early_stopping_patience: 20
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  report_to: "wandb"
  seed: 42

eval:
  enabled: true
  use_full_validation_set: true
  max_new_tokens: 128
  num_examples: 50
  sample_randomly: true
  sample_seed: 42
  output_jsonl: "outputs/hybrid_sft_explamma_15/eval_preview.jsonl"



